name: hallway_ranged
tier: 1
overflux_variants:
  frenzied: hallway_ranged_frenzied.yaml
max_health: 210
move_speed: 3.5
radius: 0.8
preferred_range: 8.0
backpedal_speed: 3.0
anti_repeat: 1.0

abilities:
  # Energy salvo: a telegraphed burst of 3 rounds at the same target. The mob
  # circle-strafes between salvos (see tree) instead of standing still.
  # Cadence, not per-bolt damage, is the pressure knob: with a 1.0s cooldown
  # two ranged mobs were a near-continuous hose and dominated small-group
  # incoming damage (2026-07 playtest); 2.0s makes each salvo a discrete,
  # reactable threat while a full 3-bolt hit still hurts.
  - name: energy_bolt
    type: ranged
    target: nearest
    telegraph_time: 0.5
    execute_time: 0.1
    cooldown_time: 2.0
    base_weight: 100
    min_range: 2.0
    track_target: true
    projectile_origin_y: 1.2
    damage_source: 2
    pattern:
      emitters:
        - type: targeted
          count: 1
          waves: 3
          wave_interval: 0.12
          aim_at_target: true
          projectile:
            speed: 18.0
            damage: 25.0
            lifetime: 4.0

# clear_to_fire staggers the ranged line: hold the salvo while another ranged
# mob committed within the last 0.6s (players dodge one salvo at a time; two
# at once from different angles is undodgeable), but never wait longer than
# 1.5s (pressure valve: on big pulls the line bursts rather than starves).
# Held mobs fall through to strafe/kite, so the pack stays in motion.
tree:
  reactive_selector:
    - sequence: [is_dead, stop]
    - sequence: [phase_transitioning, wait_transition]
    - sequence: ["!has_target", aggro_or_patrol]
    - sequence: ["!in_leash_range", leash_reset]
    - sequence: [is_committed, wait_ability]      # hold still during a salvo
    - sequence: [has_los, "clear_to_fire(0.6, 1.5)", attack]  # fire when the line is clear
    - sequence: ["target_beyond(5)", strafe]      # held or between salvos: circle-strafe
    - chase                                       # too close / no LoS: kite (backpedal/advance)
