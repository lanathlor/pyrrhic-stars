name: guard_captain
tier: 3
overflux_variants:
  tempered: guard_captain_tempered.yaml
  volatile: guard_captain_volatile.yaml
max_health: 1800
move_speed: 4.0
radius: 1.0
anti_repeat: 2.0

abilities:
  # Damage profile: the big telegraphed hits (swipe, slam, charge) carry the
  # threat and punish face-tanking; projectile patterns are light chip so a
  # player who dodges the telegraphs survives. Guarded by the guard_captain
  # and guard_captain_duo fuzz specs (facetank_duo must lose, duo_blades must
  # usually win).
  - name: melee_swipe
    type: melee
    target: nearest
    telegraph_time: 1.2
    execute_time: 0.3
    cooldown_time: 3.0
    base_weight: 30
    max_range: 3.0
    face_target: true
    melee_range: 3.0
    melee_damage: 30.0
    melee_cone_deg: 120
    damage_source: 1

  - name: fireball_burst
    type: ranged
    target: farthest
    telegraph_time: 1.0
    execute_time: 0.1
    cooldown_time: 12.0
    base_weight: 25
    min_range: 3.0
    face_target: false
    track_target: true
    projectile_origin_y: 1.5
    damage_source: 2
    pattern:
      emitters:
        - type: cone
          count: 5
          waves: 3
          wave_interval: 0.2
          arc_angle: 40
          projectile:
            speed: 12
            damage: 7
            lifetime: 3
        - type: radial
          count: 12
          waves: 2
          wave_interval: 0.15
          offset_per_wave: 15
          projectile:
            speed: 6
            damage: 5
            lifetime: 4
            angular_velocity: 22.92

  - name: void_barrage
    type: ranged
    target: current
    telegraph_time: 1.3
    execute_time: 0.1
    cooldown_time: 14.0
    base_weight: 15
    min_range: 0
    face_target: false
    track_target: true
    projectile_origin_y: 0.0
    damage_source: 2
    pattern:
      emitters:
        - type: ring_contract
          count: 12
          waves: 1
          start_radius: 12
          projectile:
            speed: 5
            damage: 7
            lifetime: 3
        - type: cone
          count: 7
          waves: 3
          wave_interval: 0.15
          arc_angle: 50
          offset_per_wave: 8
          projectile:
            speed: 10
            damage: 5
            lifetime: 2.5

  - name: ground_slam
    type: aoe
    target: nearest
    telegraph_time: 1.5
    execute_time: 0.1
    cooldown_time: 12.0
    base_weight: 15
    max_range: 7.5
    face_target: true
    aoe_radius: 6.5
    aoe_damage: 60.0
    damage_source: 3

  - name: bull_charge
    type: charge
    target: nearest
    telegraph_time: 1.0
    cooldown_time: 15.0
    base_weight: 15
    min_range: 6.0
    face_target: true
    charge_speed: 12.0
    charge_damage: 50.0
    charge_max_distance: 15.0
    charge_hit_radius: 2.0
    charge_stop_on_wall: true
    charge_stop_on_obstacle: true
    damage_source: 4

  # Anti-cheese punish for players who hug pillars to kite. Huge blast around
  # every pillar, ignores line of sight, near-impossible to dodge without
  # abandoning cover entirely. Triggered by player_camping_pillar in the tree.
  - name: pillar_overload
    type: aoe_obstacles
    target: nearest
    telegraph_time: 1.0
    execute_time: 0.2
    cooldown_time: 2.0
    base_weight: 100
    face_target: false
    aoe_radius: 2.0
    aoe_damage: 140.0
    damage_source: 6

phases:
  - hp_threshold_pct: 0.6
    transition_time: 1.5
    move_speed: 5.0
    cooldown_override: 0.6
    ability_overrides:
      melee_swipe:
        telegraph_time: 1.2
        damage: 34.0
        cooldown_time: 2.5
      fireball_burst:
        telegraph_time: 0.8
        cooldown_time: 8.0
      void_barrage:
        telegraph_time: 1.0
        cooldown_time: 9.0
      ground_slam:
        telegraph_time: 1.2
        aoe_radius: 7.5
        cooldown_time: 8.0
      bull_charge:
        telegraph_time: 0.8
        damage: 55.0
        charge_speed: 14.0
        charge_max_distance: 18.0
        cooldown_time: 10.0

  - hp_threshold_pct: 0.3
    transition_time: 1.5
    move_speed: 5.0
    cooldown_override: 0.5
    ability_overrides:
      melee_swipe:
        telegraph_time: 1.2
        damage: 32.0
        cooldown_time: 2.5
      fireball_burst:
        telegraph_time: 0.6
        cooldown_time: 6.0
      void_barrage:
        telegraph_time: 0.8
        cooldown_time: 7.0
      ground_slam:
        telegraph_time: 1.0
        aoe_radius: 7.5
        damage: 65.0
        cooldown_time: 7.0
      bull_charge:
        telegraph_time: 0.8
        damage: 52.0
        charge_speed: 14.0
        charge_max_distance: 18.0
        cooldown_time: 8.0

# Composite discipline: any branch whose tail action stays Running for a long
# stretch (chase) must be reactive_sequence/reactive_selector, or the cached
# running child skips the guards forever and the boss stops casting (the
# "one spell per fight" bug). Plain sequences are fine for one-shot commit
# chains: the is_committed branch above them re-takes control on the next
# tick, which resets them.
tree:
  reactive_selector:
    # --- Lifecycle guards ---
    - sequence: [is_dead, stop]
    - sequence: [phase_transitioning, wait_transition]
    - sequence: ["!has_target", aggro_or_patrol]
    - sequence: ["!in_leash_range", leash_reset]
    # Active ability in progress — don't interrupt. Keep closing distance
    # during the post-ability recovery window instead of standing frozen.
    - reactive_sequence:
        - is_committed
        - reactive_selector:
            - reactive_sequence: [can_move, chase]
            - wait_ability
    # Anti-cheese: a player has been hugging a pillar to kite. Overload the
    # pillars with a huge, near-unavoidable blast. Fires in any phase.
    - sequence: [player_camping_pillar, "ability_ready(pillar_overload)", "commit(pillar_overload)", wait_ability]

    # === Phase 3: Enraged — relentless, void_barrage always seeks clusters ===
    - reactive_sequence:
        - phase_eq(3)
        - reactive_selector:
            - sequence: ["target_beyond(10)", has_los, "ability_ready(bull_charge)", "commit(bull_charge)", wait_ability]
            - sequence: ["ability_ready(ground_slam)", "commit(ground_slam)", wait_ability]
            - sequence: ["ability_ready(void_barrage)", set_target_clustered, "commit(void_barrage)", wait_ability]
            - sequence: [has_los, "ability_ready(fireball_burst)", "commit(fireball_burst)", wait_ability]
            - sequence: [target_in_melee_range, has_los, "ability_ready(melee_swipe)", "commit(melee_swipe)", wait_ability]
            - chase

    # === Phase 2: Aggressive — void_barrage prefers clusters, falls back nearest ===
    - reactive_sequence:
        - phase_eq(2)
        - reactive_selector:
            - sequence: ["target_beyond(8)", has_los, "ability_ready(bull_charge)", "commit(bull_charge)", wait_ability]
            - sequence: ["ability_ready(ground_slam)", "commit(ground_slam)", wait_ability]
            - sequence: ["n_players_clustered(2)", "ability_ready(void_barrage)", set_target_clustered, "commit(void_barrage)", wait_ability]
            - sequence: [has_los, "ability_ready(void_barrage)", set_target_nearest, "commit(void_barrage)", wait_ability]
            - sequence: ["target_beyond(3)", has_los, "ability_ready(fireball_burst)", "commit(fireball_burst)", wait_ability]
            - sequence: [target_in_melee_range, has_los, "ability_ready(melee_swipe)", "commit(melee_swipe)", wait_ability]
            - chase

    # === Phase 1: Methodical — melee focused, void_barrage only on clusters.
    # bull_charge gates at 6m (not 10) so a kiter hovering just outside melee
    # still eats the gap-closer: the boss walks slower than a running player,
    # so without it phase 1 has zero pressure on anyone who keeps moving. ===
    - reactive_selector:
        - sequence: [target_in_melee_range, has_los, "ability_ready(melee_swipe)", "commit(melee_swipe)", wait_ability]
        - sequence: ["players_in_aoe(5)", "ability_ready(ground_slam)", "commit(ground_slam)", wait_ability]
        - sequence: ["n_players_clustered(2)", "ability_ready(void_barrage)", set_target_clustered, "commit(void_barrage)", wait_ability]
        - sequence: ["target_beyond(6)", has_los, "ability_ready(bull_charge)", "commit(bull_charge)", wait_ability]
        - sequence: ["target_beyond(3)", has_los, "ability_ready(fireball_burst)", "commit(fireball_burst)", wait_ability]
        - chase
